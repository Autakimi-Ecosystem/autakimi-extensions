name: Extensions Build & Health Check CI

on:
  push:
    branches: [ main, develop, cool ]
  pull_request:
    branches: [ main, develop, cool ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension Bundles and Catalogs
        run: npm run build

      - name: Run Extension Health Checker
        run: npm run test:extensions

